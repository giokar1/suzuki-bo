[project]
name = "suzuki-bo"
version = "0.1.0"
description = "Bayesian optimization for Suzuki-Miyaura coupling using AstraZeneca HTE dataset"
readme = "README.md"
authors = [
    { name = "Giorgi Karenka", email = "heorhikarenka1@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "ipykernel>=7.4.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "openpyxl>=3.1.5",
    "pandas>=3.0.6",
    "plotly>=7.1.0",
    "rdkit>=2026.3.6",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "streamlit>=1.64.0",
]

[project.scripts]
suzuki-bo = "suzuki_bo:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"
